import io.github.headlesshq.headlessmc.gradle.HeadlessMcRunTask
import me.earth.headlessmc.launcher.modlauncher.Modlauncher

buildscript {
    repositories {
        maven {
            name = "3arthMaven"
            url = "https://3arthqu4ke.github.io/maven"
        }
    }

    dependencies {
        classpath "me.earth.headlessmc:headlessmc-launcher:2.1.0"
        classpath "io.github.headlesshq:headlessmc-gradle-plugin:0.3.0"
    }
}

plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.2-SNAPSHOT'
    id 'io.github.headlesshq.headlessmc-gradle-plugin' version '0.3.0'
}

group 'me.earth.headlessmc'
version "${project(':hmc-optimizations-api').project_version}"

base {
    archivesName = "hmc-optimizations-${minecraft_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

sourceSets {
    fabric
    neoforge
    lexforge
}

repositories {
    mavenCentral()
    maven {
        url = "https://files.minecraftforge.net/maven"
    }
    maven {
        name = "sponge"
        url = "https://repo.spongepowered.org/maven"
    }
    maven {
        url = "https://maven.wagyourtail.xyz/releases"
    }

    maven {
        name = '3arthMaven'
        url = 'https://3arthqu4ke.github.io/maven'
    }
}

unimined.minecraft {
    version project.minecraft_version

    mappings {
        mojmap()
        // intermediary()
        // yarn(1)

        devFallbackNamespace "mojmap"

        /*stub.withMappings("intermediary", ["yarn"]) {
            c("net/minecraft/class_1927", []) {
                m("method_55109", "()Lnet/minecraft/class_243;", ["getPos"])
            }
        }*/
    }

    runs {
        // https://github.com/unimined/unimined/issues/98
        off = true
    }

    defaultRemapJar = false
}

unimined.minecraft(sourceSets.fabric) {
    combineWith(sourceSets.main)

    fabric {
        loader project.fabric_version
    }

    defaultRemapJar = true
}

unimined.minecraft(sourceSets.neoforge) {
    combineWith(sourceSets.main)

    neoForged {
        loader project.neoforge_version
        mixinConfig 'hmcoptimizations.mixins.json'
    }

    minecraftRemapper.config {
        // neoforge adds 1 conflict, where 2 interfaces have a method with the same name on yarn/mojmap,
        // but the method has different names in the intermediary mappings.
        // this is a conflict because they have a class that extends both interfaces.
        // this shouldn't be a problem as long as named mappings don't make the name of those 2 methods different.
        ignoreConflicts(true)
    }

    defaultRemapJar = true
}

unimined.minecraft(sourceSets.lexforge) {
    combineWith(sourceSets.main)

    minecraftForge {
        loader project.lexforge_version
        mixinConfig 'hmcoptimizations.mixins.json'
    }

    minecraftRemapper.config {
        ignoreConflicts(true)
    }

    defaultRemapJar = true
}

configurations {
    mainImplementation
    // bundled into the release jars
    jarLibs {
        transitive = false
    }

    for (String name : ['implementation', 'fabricImplementation', 'neoforgeImplementation', 'lexforgeImplementation']) {
        getByName(name).extendsFrom(jarLibs)
    }
}

configurations {
    lwjglAgent.extendsFrom runtimeOnly
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5-SNAPSHOT'
    jarLibs project(':hmc-optimizations-api')
    lwjglAgent 'me.earth.headlessmc:headlessmc-lwjgl:2.1.0'
}

// The release jars contain the remapped mod and the hmc-optimizations-api
for (String loader : ['fabric', 'neoforge', 'lexforge']) {
    def platform = loader // groovy weirdness, the closures need their own variable
    def remapJar = tasks.named("remap${platform.capitalize()}Jar", AbstractArchiveTask)
    def releaseJar = tasks.register("${platform}ReleaseJar", Jar) {
        group = 'build'
        archiveClassifier = "${platform}-release"
        dependsOn(remapJar)
        from({ zipTree(remapJar.get().archiveFile) }) {
            exclude 'META-INF/MANIFEST.MF'
        }
        from({ configurations.jarLibs.collect { zipTree(it) } }) {
            exclude 'META-INF/MANIFEST.MF'
        }
    }

    tasks.named('build') { dependsOn(releaseJar) }
}

